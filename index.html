<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMU LOST&amp;FOUND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4FB; --paper-2:#EEE9F9; --card:#FFFFFF;
    --ink:#241733; --ink-soft:#6B6284; --line:#E8E2F3;
    --lost:#B32E63; --lost-soft:#FBE4EE;
    --found:#1B7A5F; --found-soft:#DFF3EB;
    --purple:#6B41B8; --purple-deep:#4F2B93; --purple-soft:#EFE7FB;
    --amber:#9A6510; --amber-soft:#FBF1DC;
    --shadow:0 10px 26px -14px rgba(91,50,168,.35);
    --shadow-sm:0 4px 12px -6px rgba(91,50,168,.25);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Sarabun',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.display{font-family:'Prompt',sans-serif;font-weight:600}
  button{font-family:inherit}
  ::selection{background:var(--purple-soft)}
  .hidden{display:none !important}

  .skip-link{position:absolute;left:-9999px;top:0;z-index:999;background:var(--purple);color:#fff;padding:12px 18px;border-radius:0 0 12px 0}
  .skip-link:focus{left:0}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :focus-visible{outline:3px solid var(--purple);outline-offset:2px}

  .stamp{display:inline-flex;align-items:center;gap:6px;font-family:'Prompt',sans-serif;font-weight:500;font-size:12px;padding:4px 12px;border-radius:999px}
  .stamp.lost{color:var(--lost);background:var(--lost-soft)}
  .stamp.found{color:var(--found);background:var(--found-soft)}

  header.top{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:var(--shadow-sm);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .tagicon{width:38px;height:38px;flex:none;border-radius:12px;background:var(--purple);display:flex;align-items:center;justify-content:center;font-family:'Prompt',sans-serif;font-weight:600;color:#fff;font-size:14px}
  .brand h1{font-size:18px;margin:0;line-height:1.15}
  .brand p{margin:0;font-size:11.5px;color:var(--ink-soft)}
  
  /* ระบบโปรไฟล์แบบวงกลมพร้อมดรอปดาวน์ และปุ่มแยกด้านนอก */
  .userchip{position:relative;display:flex;align-items:center;gap:8px;flex:none}
  .user-avatar-btn{
    width:40px;height:40px;border-radius:50%;background:var(--purple);color:#fff;
    font-family:'Prompt',sans-serif;font-weight:600;font-size:16px;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:.15s;padding:0;
  }
  .user-avatar-btn:hover{background:var(--purple-deep);transform:scale(1.05)}
  
  .user-dropdown{
    position:absolute;top:calc(100% + 10px);right:0;width:240px;background:var(--card);
    border-radius:18px;box-shadow:var(--shadow);border:1.5px solid var(--line);padding:8px;z-index:100;
    display:flex;flex-direction:column;gap:4px;transform-origin:top right;transition:.15s;
  }
  .user-dropdown.hidden{display:none}
  .user-dropdown-header{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .user-dropdown-header .ud-name{font-family:'Prompt',sans-serif;font-weight:600;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-dropdown-header .ud-email{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  
  .user-dropdown button{
    width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;
    font-size:13.5px;cursor:pointer;color:var(--ink);font-family:inherit;display:flex;align-items:center;gap:8px;transition:.1s;
  }
  .user-dropdown button:hover{background:var(--purple-soft);color:var(--purple)}
  .user-dropdown button.danger:hover{background:var(--lost-soft);color:var(--lost)}

  .btn{font-size:13.5px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);font-weight:500;transition:.15s}
  .btn:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-soft)}
  .btn.primary{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:var(--shadow-sm)}
  .btn.primary:hover{background:var(--purple-deep);border-color:var(--purple-deep);color:#fff}
  .btn.accent{border-color:var(--found);color:var(--found);background:var(--found-soft)}
  .btn.accent:hover{background:var(--found);color:#fff}
  .btn.danger{border-color:var(--lost);color:var(--lost);background:var(--lost-soft)}
  .btn.danger:hover{background:var(--lost);color:#fff}
  .btn.small{padding:6px 12px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .langbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-weight:600;letter-spacing:.03em}
  .langbtn:hover{border-color:var(--purple);color:var(--purple)}

  #authScreen,#verifyScreen{max-width:420px;margin:50px auto;padding:0 20px 60px}
  .auth-card{background:var(--card);border-radius:24px;padding:34px 30px;box-shadow:var(--shadow)}
  .auth-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .auth-card h2{font-size:24px;margin:0}
  .auth-card p.sub{margin:4px 0 22px;color:var(--ink-soft);font-size:13.5px}
  .tabs-auth{display:flex;gap:6px;margin-bottom:20px;background:var(--paper-2);padding:5px;border-radius:999px}
  .tabs-auth button{flex:1;padding:9px;border-radius:999px;border:none;background:transparent;font-size:13.5px;cursor:pointer;color:var(--ink-soft);font-weight:500}
  .tabs-auth button.active{color:var(--purple);background:var(--card);box-shadow:var(--shadow-sm);font-weight:600}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:14.5px;background:var(--paper);color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--purple);background:#fff}
  .field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.6}
  .msgline{font-size:12.5px;margin-top:6px;min-height:1em;line-height:1.6}

  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:44px}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:16px;padding:6px 8px;border-radius:8px;line-height:1;color:var(--ink-soft)}
  .pw-eye:hover{background:var(--paper-2)}
  .pw-bar{height:4px;background:var(--paper-2);border-radius:999px;overflow:hidden;margin-top:8px}
  .pw-bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s,background .25s}
  .pw-missing{font-size:11.5px;color:var(--lost);margin-top:6px;line-height:1.6}

  #authError{font-size:13px;margin:4px 0 12px;min-height:1em;color:var(--lost)}
  .authnote{font-size:11.5px;color:var(--ink-soft);margin-top:16px;text-align:center;line-height:1.6}

  .tips{background:var(--paper);border-radius:14px;padding:14px 16px;margin-top:18px;font-size:12px;color:var(--ink-soft);line-height:1.8}
  .tips b{color:var(--ink);font-family:'Prompt',sans-serif;display:block;margin-bottom:6px}
  .tips ul{margin:0;padding-left:18px}

  #appScreen{max-width:1080px;margin:0 auto;padding:0 20px 80px}
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:14px 0;margin-bottom:22px;background:var(--card);border-radius:999px;box-shadow:var(--shadow-sm);position:sticky;top:70px;z-index:10}
  nav.tabs button{white-space:nowrap;padding:10px 18px;border-radius:999px;border:none;margin:0 4px;background:transparent;font-size:14px;cursor:pointer;color:var(--ink-soft);font-weight:500;display:flex;align-items:center;gap:6px}
  nav.tabs button.active{background:var(--purple);color:#fff;font-weight:600}
  
  .badge-count{
    min-width:20px;height:20px;border-radius:999px;background:var(--lost);
    color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;
    transform:scale(0);transition:transform .3s cubic-bezier(.34,1.6,.64,1);
  }
  .badge-count.show{transform:scale(1)}

  section.view{display:none}
  section.view.active{display:block}
  .view-head{margin-bottom:16px}
  .view-head h2{font-size:22px;margin:0}
  .view-head .sub{font-size:13px;color:var(--ink-soft);margin-top:4px}

  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-row select,.filter-row input{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;color:var(--ink);font-family:inherit}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .tagcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;width:100%;text-align:left;border:0;padding:0;font-family:inherit;cursor:pointer}
  .tagcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .tagcard .photo{height:150px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;overflow:hidden}
  .tagcard .photo img{width:100%;height:100%;object-fit:cover}
  .tagcard .body{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .tagcard .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tagcard .cat{font-family:'Prompt',sans-serif;font-weight:600;font-size:15px}
  .tagcard .desc{font-size:13px;color:var(--ink-soft);line-height:1.55;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tagcard .meta{font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:9px}
  .colordot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
  .status-strip{font-size:11px;text-align:center;padding:6px;font-weight:500;background:var(--found);color:#fff}

  .add-card-placeholder{
    background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);
    min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;cursor:pointer;transition:.15s;text-align:center;padding:20px;width:100%;font-family:inherit;
  }
  .add-card-placeholder:hover{border-color:var(--purple);background:var(--purple-soft)}
  .add-card-placeholder .plus-icon{width:46px;height:46px;border-radius:50%;background:var(--purple-soft);color:var(--purple);font-size:24px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .add-card-placeholder:hover .plus-icon{background:var(--purple);color:#fff}
  .add-card-placeholder .add-text{font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;color:var(--ink)}
  .add-card-placeholder .add-sub{font-size:12px;color:var(--ink-soft)}

  .mine-pinned-section{margin-bottom:24px;display:none}
  .mine-pinned-section.show{display:block}
  .mine-pinned-title{display:flex;align-items:center;gap:8px;font-family:'Prompt',sans-serif;font-weight:600;font-size:15px;margin-bottom:12px;color:var(--ink)}
  .mine-pinned-title .pin-star{color:var(--purple);font-size:20px;line-height:1}
  .mine-pinned-grid{background:var(--paper-2);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:14px 14px;border-radius:20px;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
  .mine-card-wrap{position:relative;min-width:0}
  .mine-card-wrap.pinned:nth-child(odd){transform:rotate(-.7deg)}
  .mine-card-wrap.pinned:nth-child(even){transform:rotate(.7deg)}
  .mine-card-wrap .tagcard{width:100%}
  .mine-card-wrap.pinned .tagcard{box-shadow:var(--shadow)}
  .pin-btn{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s;padding:0;color:var(--ink-soft)}
  .pin-btn:hover{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}
  .pin-btn.pinned{background:var(--purple);border-color:var(--purple);color:#fff}
  .pin-btn:focus-visible{outline:3px solid var(--purple-soft);outline-offset:2px}

 .pickup-check{
 display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:8px;
  font-size:12.5px;
  color:var(--ink-soft);
  line-height:1.6;
}

.field .pickup-check input{
  width:18px;
  height:18px;
  min-width:18px;
  margin:0;
  padding:0;
}

.pickup-check span{
  flex:0 1 auto;
  min-width:0;
}

  .empty{text-align:center;padding:56px 20px;color:var(--ink-soft);grid-column:1/-1}
  .empty .display{font-size:20px;color:var(--ink);margin-bottom:6px}

  .formcard{background:var(--card);border-radius:24px;padding:28px;max-width:640px;box-shadow:var(--shadow);margin:0 auto 16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .typepick{display:flex;gap:10px;margin-bottom:18px}
  .typepick label{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font-weight:600;font-family:'Prompt',sans-serif;font-size:15px;color:var(--ink-soft);transition:.15s}
  .typepick input{position:absolute;opacity:0;width:1px;height:1px}
  .typepick label:has(input:checked).lostL{border-color:var(--lost);background:var(--lost-soft);color:var(--lost)}
  .typepick label:has(input:checked).foundL{border-color:var(--found);background:var(--found-soft);color:var(--found)}
  .upload-preview{margin-top:10px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:none;background:var(--paper)}
  .upload-preview img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}

  .notif{background:var(--card);border-radius:16px;padding:14px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
  .notif.unread{box-shadow:0 0 0 1.5px var(--purple),var(--shadow-sm)}
  .notif .txt{font-size:14px}

  .contactreveal{
    background:var(--found-soft);color:var(--found);border-radius:12px;padding:16px 18px;font-size:13px;margin-top:10px;line-height:1.7;
    opacity:0;transform:scale(.92) translateY(6px);
    transition:opacity .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .contactreveal.show{opacity:1;transform:scale(1) translateY(0)}
  .pending-note{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:11px 16px;font-size:13px;margin-top:10px}

  .match-page{max-width:900px;margin:0 auto}
  .match-comparison{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .match-item-card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
  .match-photo{height:240px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink-soft);font-size:12px}
  .match-photo img{width:100%;height:100%;object-fit:cover}
  .match-body{padding:18px}
  .match-body h3{margin:10px 0 8px;font-size:18px}
  .match-desc{color:var(--ink-soft);line-height:1.6;font-size:13.5px;min-height:60px}
  .match-score-box{margin:18px 0;background:var(--purple-soft);border-radius:18px;padding:16px;text-align:center}
  .score-big{font-family:'Prompt',sans-serif;color:var(--purple-deep);font-size:30px;font-weight:700}
  .score-label{color:var(--ink-soft);font-size:12px}
  .match-reasons{list-style:none;padding:0;margin:12px auto 0;max-width:420px;text-align:left;font-size:12.5px;color:var(--ink-soft)}
  .match-reasons li{padding-left:20px;position:relative;margin-bottom:3px}
  .match-reasons li::before{content:"✓";position:absolute;left:2px;color:var(--found)}
  .match-actions{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .match-actions button{min-width:190px}
  .note-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink-soft);font-size:12.5px;line-height:1.7;margin-top:18px}
  .progress-line{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px}

  .panel{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow-sm);margin-bottom:16px;max-width:640px}
  .panel h3{margin:0 0 4px;font-size:17px}
  .panel .psub{color:var(--ink-soft);font-size:12.5px;margin:0 0 18px;line-height:1.7}
  .panel.danger{border:1.5px solid var(--lost-soft)}
  
  .panel select{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:14.5px;
    background:var(--paper) url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6284' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 14px center;
    background-size:16px;appearance:none;-webkit-appearance:none;color:var(--ink);cursor:pointer;
  }
  .panel select:focus{outline:none;border-color:var(--purple);background-color:#fff}

  .switch-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .switch-row:first-of-type{border-top:0}
  .switch-row .txt{flex:1;font-size:13.5px;line-height:1.6}
  .switch-row .txt small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:3px}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;pointer-events:none}
  .switch span::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + span{background:var(--found)}
  .switch input:checked + span::after{transform:translateX(20px)}

  .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
  .goal{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm)}
  .goal .big{font-family:'Prompt',sans-serif;font-size:24px;font-weight:700;color:var(--purple-deep)}
  .goal .big small{font-size:13px;color:var(--ink-soft);font-weight:400}
  .goal .lbl{font-size:12.5px;color:var(--ink-soft);margin:6px 0 8px}
  .goal .track{height:6px;background:var(--paper-2);border-radius:999px;overflow:hidden}
  .goal .track i{display:block;height:100%;border-radius:999px;background:var(--purple)}
  .goal .track i.done{background:var(--found)}
  .goal .note{font-size:11px;color:var(--ink-soft);margin-top:6px}
  .admin-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
  .admin-stat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;transition:.15s;font-family:inherit}
  .admin-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--purple)}
  .admin-stat .num{font-family:'Prompt',sans-serif;font-size:26px;font-weight:700;color:var(--purple-deep);line-height:1}
  .admin-stat .label{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .admin-detail-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .admin-post-row{background:var(--card);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;display:grid;grid-template-columns:150px 1fr;cursor:pointer;text-align:left;border:0;padding:0;font-family:inherit}
  .admin-post-row .thumb{height:150px;background:var(--paper-2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px}

  $('udName').textContent = name;
  $('udEmail').textContent = email || '';
  const initial = name.trim().charAt(0).toUpperCase();
  $('userAvatarLetter').textContent = initial || 'U';
}

function closeSettingsModal(){
  $('settingsModal').classList.add('hidden');
}

async function saveProfileModal(){
  const msg = $('prMsg'), btn = $('prSaveBtn');
  const name = $('prName').value.trim();
  if (!name){ msg.style.color='var(--lost)'; msg.textContent = t('common.required'); return; }
  btn.disabled = true;
  try{
    await updateDoc(doc(db,'users',CURRENT_UID), {
      displayName: name,
      phone: $('prPhone').value.trim(),
      faculty: $('prFaculty').value.trim()
    });
    await updateProfile(auth.currentUser, { displayName: name });
    profile = { ...profile, displayName:name, phone:$('prPhone').value.trim(), faculty:$('prFaculty').value.trim() };
    updateUserDataUI(name, auth.currentUser?.email);
    msg.style.color='var(--found)'; msg.textContent = t('profile.saved');
    setTimeout(() => closeSettingsModal(), 1200);
  }catch(err){ msg.style.color='var(--lost)'; msg.textContent = t('profile.saveFail',{msg:err.message}); }
  finally{ btn.disabled = false; }
}

async function savePrefsModal(){
  try{
    const notify = $('prNotify').checked;
    await updateDoc(doc(db,'users',CURRENT_UID), { notifyEmail: notify, lang: getLang() });
    profile = { ...profile, notifyEmail: notify, lang: getLang() };
  }catch(err){ console.warn(err); }
}

  $('mStatus').innerHTML = `<option value="">${esc(t('mine.allStatus'))}</option><option value="active">${esc(t('common.active'))}</option><option value="resolved">${esc(t('common.resolved'))}</option>`;

function showScreen(which){
  $('bootScreen').classList.toggle('hidden', which !== 'boot');
  $('authScreen').classList.toggle('hidden', which !== 'auth');
  $('verifyScreen').classList.toggle('hidden', which !== 'verify');
  $('appScreen').classList.toggle('hidden', which !== 'app');
}
function showView(name){
  currentView = name;
  document.querySelectorAll('section.view').forEach(s => s.classList.remove('active'));
  const el = $('view-' + name); if (!el) return;
  el.classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  rerender();
  window.scrollTo(0, 0);
}
function rerender(){
  if (currentView === 'mine') renderMine();
  else if (currentView === 'notif') renderNotifs();
  else if (currentView === 'matches') renderMatches();
  else if (currentView === 'match-detail') renderMatchDetail();
  else if (currentView === 'post-detail') renderPostDetail();
  else if (currentView === 'admin') renderAdmin();
  else if (currentView === 'admin-detail') renderAdminDetail();
}

function toggleEye(inputId, btn){
  const el = $(inputId);
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
  btn.setAttribute('aria-label', t(show ? 'auth.hidePassword' : 'auth.showPassword'));
}

function onPasswordInput(){
  const p1 = $('suPass').value, p2 = $('suPass2').value;
  const r = evaluatePassword(p1, { email: $('suEmail').value.trim(), name: $('suName').value.trim() });

  const bar = $('pwBar');
  bar.style.width = p1 ? ((r.score + 1) / 5 * 100) + '%' : '0';
  bar.style.background = r.color;

  const missing = r.checks.filter(c => c.required && !c.pass).map(c => c.label);
  $('pwMissing').textContent = (p1 && missing.length) ? missing.join(' · ') : '';

  const msg = $('pwMatchMsg');
  let matchOk = false;
  if (!p2) msg.textContent = '';
  else if (p1 !== p2) { msg.textContent = '✕ ' + t('auth.pwMismatch'); msg.style.color = 'var(--lost)'; }
  else { msg.textContent = '✓ ' + t('auth.pwMatch'); msg.style.color = 'var(--found)'; matchOk = true; }

  $('signupBtn').disabled = !(r.valid && matchOk);
}

function switchAuthTab(which){
  const login = which === 'login';
  $('tabLoginBtn').classList.toggle('active', login);
  $('tabSignupBtn').classList.toggle('active', !login);
  $('loginForm').classList.toggle('hidden', !login);
  $('signupForm').classList.toggle('hidden', login);
  $('authError').textContent = '';
}
function authErr(text, ok){
  const el = $('authError');
  el.style.color = ok ? 'var(--found)' : 'var(--lost)';
  el.textContent = text;
}

async function handleSignup(e){
  e.preventDefault(); authErr('');
  const name = $('suName').value.trim();
  const email = $('suEmail').value.trim().toLowerCase();
  const p1 = $('suPass').value, p2 = $('suPass2').value;
  if (!isAllowedEmail(email)) { authErr(t('auth.errCmuOnly')); return false; }
  if (p1 !== p2) { authErr(t('auth.errMismatch')); return false; }
  const r = evaluatePassword(p1, { email, name });
  if (!r.valid) { authErr(r.checks.filter(c => c.required && !c.pass).map(c => c.label).join(' · ')); return false; }

  const btn = $('signupBtn'); btn.disabled = true;
  try{
    const { user } = await createUserWithEmailAndPassword(auth, email, p1);
    await updateProfile(user, { displayName: name });
    await setDoc(doc(db,'users',user.uid), {
      displayName: name, email, role: 'user',
      phone: '', faculty: '', notifyEmail: true, lang: getLang(),
      createdAt: serverTimestamp()
    });
    await sendEmailVerification(user, { url: ACTION_URL, handleCodeInApp: false });
    goVerify(user);
  }catch(err){ authErr(thaiError(err.code)); }
  finally{ btn.disabled = false; }
  return false;
}

async function handleLogin(e){
  e.preventDefault(); authErr('');
  const btn = $('loginBtn'); btn.disabled = true;
  try{
    const { user } = await signInWithEmailAndPassword(auth, $('loginEmail').value.trim().toLowerCase(), $('loginPass').value);
    if (user.emailVerified) await enterApp(user); else goVerify(user);
  }catch(err){ authErr(thaiError(err.code)); }
  finally{ btn.disabled = false; }
  return false;
}

async function handleForgotPassword(){
  const email = $('loginEmail').value.trim().toLowerCase();
  if (!email) { authErr(t('auth.needEmailFirst')); return false; }
  try{
    await sendPasswordResetEmail(auth, email, { url: ACTION_URL, handleCodeInApp: false });
    authErr(t('auth.resetSent', { email }), true);
  }catch(err){ authErr(thaiError(err.code)); }
  return false;
}

async function handleLogout(){ await signOut(auth); location.reload(); }

function goVerify(user){
  $('verifySentTo').innerHTML = t('verify.sentTo', { email: `<b>${esc(user.email)}</b>` });
  $('verifyMsg').textContent = '';
  showScreen('verify');
}

let verifyCheckBusy = false;
async function checkEmailVerified(silent = false){
  const msg = $('verifyMsg');
  if (!auth.currentUser || verifyCheckBusy) return;
  verifyCheckBusy = true;
  if (!silent){ msg.style.color = 'var(--ink-soft)'; msg.textContent = t('common.loading'); }
  try{
    await reload(auth.currentUser);
    if (auth.currentUser.emailVerified){
      msg.style.color = 'var(--found)'; msg.textContent = t('verify.success');
      await enterApp(auth.currentUser);
    } else if (!silent){
      msg.style.color = 'var(--lost)'; msg.textContent = t('verify.notYet');
    }
  }catch(err){
    if (!silent){ msg.style.color = 'var(--lost)'; msg.textContent = thaiError(err.code); }
  }finally{
    verifyCheckBusy = false;
  }
}

// เมื่อผู้ใช้กลับจากอีเมล ให้ตรวจสถานะให้อัตโนมัติ ไม่ต้องกดปุ่มซ้ำ
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !$('verifyScreen').classList.contains('hidden')) {
    checkEmailVerified(true);
  }
});
window.addEventListener('focus', () => {
  if (!$('verifyScreen').classList.contains('hidden')) checkEmailVerified(true);
});

let resendTimer = null;
async function resendVerification(){
  const btn = $('resendBtn'); if (btn.disabled) return;
  const msg = $('verifyMsg');
  try{
    await sendEmailVerification(auth.currentUser, { url: ACTION_URL, handleCodeInApp: false });
    msg.style.color = 'var(--found)'; msg.textContent = t('verify.resent');
  }catch(err){ msg.style.color = 'var(--lost)'; msg.textContent = thaiError(err.code); return; }
  let secs = 30; btn.disabled = true;
  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    secs--; btn.textContent = t('verify.cooldown', { secs });
    if (secs <= 0){ clearInterval(resendTimer); btn.disabled = false; btn.textContent = t('verify.resend'); }
  }, 1000);
}

onAuthStateChanged(auth, async user => {
  if (!user){ showScreen('auth'); switchAuthTab('login'); applyLang(); paintLangButtons(); return; }
  if (!user.emailVerified){
    try { await reload(user); } catch(_){}
    if (!user.emailVerified){ goVerify(user); applyLang(); paintLangButtons(); return; }
  }
  await enterApp(user);
});

async function enterApp(user){
  showScreen('boot');
  // บังคับออก token ใหม่หลังยืนยันอีเมล เพื่อให้ Firestore Rules เห็น
  // email_verified เป็น true เหมือนกันทุกเบราว์เซอร์
  try {
    await reload(user);
    if (!user.emailVerified) {
      goVerify(user);
      return;
    }
    await getIdToken(user, true);
    const tokenResult = await getIdTokenResult(user, true);
    IS_ADMIN = tokenResult.claims.admin === true;
  } catch (err) {
    console.warn('รีเฟรชสถานะบัญชีไม่สำเร็จ:', err.message);
  }
  CURRENT_UID = user.uid;

  try{
    const s = await getDoc(doc(db,'users',user.uid));
    profile = s.exists() ? s.data() : { role:'user', notifyEmail:true };
  }catch(_){ profile = { role:'user', notifyEmail:true }; }

  updateUserDataUI(profile.displayName || user.displayName, user.email);

  if (profile.lang && profile.lang !== getLang()) setLang(profile.lang);
  $('adminTab').classList.toggle('hidden', !IS_ADMIN);

  fillSelects();
  const today = new Date().toISOString().slice(0,10);
  $('pDate').value = today; $('pDate').max = today;

  try {
    await loadData();
  } catch (err) {
    console.error('loadData failed:', err);
    allPosts = [];
    allMatches = [];
  }
  booted = true;
  showScreen('app');
  applyLang(); paintLangButtons();
  showView('mine');
}

async function loadData(){
  const ps = await getDocs(query(collection(db,'posts'), where('authorId','==',CURRENT_UID)));
  allPosts = ps.docs.map(d => ({ id:d.id, ...d.data() }))
                    .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  const ms = await getDocs(query(collection(db,'matches'), where('participantIds','array-contains',CURRENT_UID)));
  allMatches = ms.docs.map(d => ({ id:d.id, ...d.data() }))
                      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  await Promise.all(allMatches.filter(m => m.matchStatus === 'accepted').map(loadContactForMatch));
  updateBadge();
}

async function loadContactForMatch(m){
  if (!m || m.matchStatus !== 'accepted') return m;
  try{
    const contactSnap = await getDoc(doc(db,'matchContacts',m.id));
    if (contactSnap.exists()) Object.assign(m, contactSnap.data(), { contactRevealed:true });
  }catch(err){
    console.warn('โหลดข้อมูลติดต่อไม่สำเร็จ:', err.message);
  }
  return m;
}
function pinnedIds(){ return Array.isArray(profile?.pinnedPostIds) ? profile.pinnedPostIds : []; }

function updateBadge(){
  const n = allMatches.filter(m => m.lostAuthorId === CURRENT_UID && m.matchStatus === 'waiting_for_user').length;
  const badge = $('notifBadge');
  badge.textContent = n;
  if (n > 0){
    badge.classList.remove('hidden');
    setTimeout(() => badge.classList.add('show'), 50);
  } else {
    badge.classList.remove('show');
    badge.classList.add('hidden');
  }
}

let refreshing = false;
async function refreshNow(silent){
  if (refreshing || !CURRENT_UID) return;
  refreshing = true;
  const btn = $('refreshBtn');
  if (!silent && btn){ btn.disabled = true; btn.textContent = '⋯'; }
  const before = JSON.stringify([allPosts.map(p=>p.id+p.status), allMatches.map(m=>m.id+m.matchStatus+m.contactRevealed)]);
  try{
    await loadData();
    const after = JSON.stringify([allPosts.map(p=>p.id+p.status), allMatches.map(m=>m.id+m.matchStatus+m.contactRevealed)]);
    if (before !== after && currentView !== 'match-detail') rerender();
  }catch(err){ console.error(err); }
  finally{
    refreshing = false;
    if (!silent && btn){ btn.disabled = false; btn.textContent = '↻'; }
  }
}
setInterval(() => {
  if (document.visibilityState === 'visible') refreshNow(true);
}, 300000);

function colorHex(n){
  return {'ดำ':'#222','ขาว':'#fff','แดง':'#c0392b','น้ำเงิน':'#2c5faa','เขียว':'#2f6e5b','เหลือง':'#e0b400','ชมพู':'#e07ba0','เทา':'#8b8b8b','น้ำตาล':'#7a5230'}[n] || '#7B4FCB';

function emptyState(a, b){ return `<div class="empty"><div class="display">${esc(a)}</div><div>${esc(b)}</div></div>`; }
function fmtDate(d){
  if (!d) return '-';
  const dt = new Date(d);
  return isNaN(dt) ? esc(d) : dt.toLocaleDateString(getLang()==='th'?'th-TH':'en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function timeAgo(c){
  const s = Math.floor(Date.now()/1000) - (c?.seconds||0);
  const m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
  if (getLang() === 'en') return d>0?`${d} day(s) ago`:h>0?`${h} hour(s) ago`:m>0?`${m} minute(s) ago`:'just now';
  return d>0?`${d} วันที่แล้ว`:h>0?`${h} ชั่วโมงที่แล้ว`:m>0?`${m} นาทีที่แล้ว`:'เมื่อสักครู่';
}
function typeLabel(ty){ return ty === 'lost' ? t('common.lost') : t('common.found'); }

function renderMine(){
  const ty = $('mType').value, ca = $('mCat').value, st = $('mStatus').value;
  const q = $('mQ').value.trim().toLowerCase();
  const list = allPosts.filter(p =>
    (!ty || p.type === ty) && (!ca || p.category === ca) && (!st || p.status === st) &&
    (!q || ((p.description||'') + ' ' + (p.category||'') + ' ' + (p.location||'')).toLowerCase().includes(q)));

  const mineIds = new Set(allPosts.map(p => p.id));
  const pins = pinnedIds().filter(id => mineIds.has(id));
  const pinnedPosts = pins.map(id => allPosts.find(p => p.id === id)).filter(Boolean);
  const rest = list.filter(p => !pins.includes(p.id));
  const section = $('minePinnedSection');

  if (section){
    section.classList.toggle('show', pinnedPosts.length > 0);
    section.innerHTML = pinnedPosts.length
      ? `<div class="mine-pinned-title"><span class="pin-star">★</span>${esc(t('mine.pinnedTitle'))} <span class="sub">(${pinnedPosts.length}/3)</span></div>
         <div class="mine-pinned-grid">${pinnedPosts.map(p => cardHTML(p, true)).join('')}</div>`
      : '';
  }

  $('mineCount').textContent = allPosts.length ? t('mine.count', { n:list.length, total:allPosts.length }) : '';
  
  const cardsHTML = rest.map(p => cardHTML(p, false)).join('');
  const addCardHTML = `<button class="add-card-placeholder" onclick="showView('create')">
    <div class="plus-icon">+</div>
    <div class="add-text">ลงประกาศใหม่</div>
    <div class="add-sub">เพิ่มรายการของหายหรือพบของ</div>
  </button>`;

let imageData = '', thumbData = '';
const ALLOWED_IMAGE = ['image/jpeg','image/png','image/webp','image/gif'];
function clearImage(text){
  imageData = ''; thumbData = '';
  $('imagePreview').style.display = 'none';
  $('imagePreviewImg').removeAttribute('src');
  $('pImage').value = '';
  const m = $('imageMsg'); m.style.color = 'var(--lost)'; m.textContent = text || '';
}
function previewPostImage(e){
  const f = e.target.files?.[0], m = $('imageMsg');
  m.textContent = '';
  if (!f) return clearImage('');
  const extOk = /\.(jpe?g|png|webp|gif)$/i.test(f.name);
  if (!ALLOWED_IMAGE.includes(f.type) || !extOk){
    return clearImage(t('create.imgBad', { ext: (f.name.split('.').pop()||'').toUpperCase() }));
  }
  if (f.size > 10*1024*1024) return clearImage(t('create.imgBig', { mb:(f.size/1048576).toFixed(1) }));
  m.style.color = 'var(--ink-soft)'; m.textContent = t('create.imgShrink');
  Promise.all([shrinkImage(f, 800, 700000), shrinkImage(f, 240, 55000)]).then(([full, thumb]) => {
    imageData = full; thumbData = thumb;
    $('imagePreviewImg').src = thumb;
    $('imagePreviewImg').alt = '';
    $('imagePreview').style.display = 'block';
    m.style.color = 'var(--found)'; m.textContent = t('create.imgReady', { kb:(full.length/1024).toFixed(0) });
  }).catch(() => clearImage(t('create.imgFail')));
}
function shrinkImage(file, maxSide = 800, budget = 700000){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width*sc); cv.height = Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        let q = 0.7, out = cv.toDataURL('image/jpeg', q);
        while (out.length > budget && q > 0.25){ q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
        // อย่าส่งรูปที่ยังเกินเพดานไปให้ Firestore เพราะ Rules จะตอบกลับเพียง
        // Missing or insufficient permissions ซึ่งทำให้ผู้ใช้ไม่รู้ว่าสาเหตุคือขนาดรูป
        if (out.length > budget) return rej(new Error('image-too-large'));
        res(out);
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const DAILY_POST_LIMIT = 5;
const ACTIVE_POST_LIMIT = 15;

async function handleCreatePost(e){
  e.preventDefault();
  const btn = $('postSubmitBtn'), msg = $('postMsg');
  msg.textContent = '';

  const today = new Date().toISOString().slice(0,10);
  const usedToday = profile?.postCountDate === today ? (profile?.postCountToday || 0) : 0;
  
  if (!editingPostId && usedToday >= DAILY_POST_LIMIT){
    msg.style.color = 'var(--lost)';
    msg.textContent = t('limit.title') + ' — ' + t('limit.body', { n: DAILY_POST_LIMIT });
    return false;
  }
  const openPosts = allPosts.filter(p => p.status === 'active').length;
  if (!editingPostId && openPosts >= ACTIVE_POST_LIMIT){
    msg.style.color = 'var(--lost)';
    msg.textContent = t('limit.active', { n: openPosts });
    return false;
  }

  const category = fieldValue('pCategory'), color = fieldValue('pColor'), location = fieldValue('pLocation');
  if (!category || !color || !location){
    msg.style.color = 'var(--lost)'; msg.textContent = t('create.otherRequired'); return false;
  }

  const ptype = document.querySelector('input[name=ptype]:checked').value;
  let pickupNote = '';
  if (ptype === 'found'){
    pickupNote = $('pPickupUnsure').checked ? t('create.pickupNoteUnsureText') : $('pPickupNote').value.trim();
    if (!pickupNote){
      msg.style.color = 'var(--lost)'; msg.textContent = t('create.pickupNoteRequired'); return false;
    }
  }

  const desc = $('pDesc').value.trim();
  let autoCategorized = false, finalCategory = category;
  if (!hasReadableText(desc)){ finalCategory = 'อื่นๆ'; autoCategorized = true; }

  btn.disabled = true; 
  btn.classList.add('loading');

  try{
    if (editingPostId) {
      await updateDoc(doc(db, 'posts', editingPostId), {
        type: ptype, category: finalCategory, color, description: desc, location,
        eventDate: $('pDate').value, pickupNote,
        thumbUrl: thumbData || postById(editingPostId)?.thumbUrl || '',
        hasImage: !!imageData || postById(editingPostId)?.hasImage || false,
        // กลับเข้าคิวให้ระบบจับคู่ใหม่ เพราะคำอธิบาย/หมวดหมู่/สถานที่อาจเปลี่ยนไป
        processed: autoCategorized,
        autoCategorized
      });
      if (imageData) {
        await setDoc(doc(db, 'postImages', editingPostId), { authorId: CURRENT_UID, data: imageData });
      }
      const idx = allPosts.findIndex(x => x.id === editingPostId);
      if (idx !== -1) {
        allPosts[idx] = { ...allPosts[idx], type: ptype, category: finalCategory, color, description: desc, location, eventDate: $('pDate').value, pickupNote, thumbUrl: thumbData || allPosts[idx].thumbUrl, processed: autoCategorized, autoCategorized };
      }
      editingPostId = null;
      $('postSubmitBtn').querySelector('.btn-label').textContent = t('create.submit');
      msg.style.color = 'var(--found)';
      msg.textContent = "แก้ไขประกาศเรียบร้อยแล้ว";
      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;
        $('postForm').reset();
        showView('mine');
      }, 1000);
    } else {
      const data = {
        authorId: CURRENT_UID,
        authorName: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
        authorEmail: auth.currentUser.email,
        type: ptype,
        category: finalCategory, color, description: desc, location,
        eventDate: $('pDate').value,
        thumbUrl: thumbData || '',
        hasImage: !!imageData,
        status: 'active',
        autoCategorized,
        processed: autoCategorized,
        pickupNote,
        createdAt: serverTimestamp()
      };
      const ref = await addDoc(collection(db,'posts'), data);
      if (imageData){
        try{ await setDoc(doc(db,'postImages',ref.id), { authorId: CURRENT_UID, data: imageData }); }catch(_){}
      }
      try{
        await updateDoc(doc(db,'users',CURRENT_UID), { postCountDate: today, postCountToday: usedToday + 1 });
        profile = { ...profile, postCountDate: today, postCountToday: usedToday + 1 };
      }catch(_){}
      allPosts.unshift({ id:ref.id, ...data, createdAt:{ seconds: Math.floor(Date.now()/1000) } });
      
      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;
        $('postForm').reset();
        ['pCategory','pColor','pLocation'].forEach(id => { $(id+'Other').classList.add('hidden'); $(id+'Other').required=false; });
        $('pickupNoteField').classList.add('hidden');
        $('pPickupNote').disabled = false;
        clearImage('');
        $('pDate').value = new Date().toISOString().slice(0,10);
        msg.style.color = autoCategorized ? 'var(--amber)' : 'var(--found)';
        msg.textContent = t(autoCategorized ? 'create.okAuto' : 'create.ok');
        setTimeout(() => showView('mine'), 1000);
      }, 800);
    }
  }catch(err){
    btn.classList.remove('loading');
    btn.disabled = false;
    msg.style.color = 'var(--lost)'; msg.textContent = t('create.fail', { msg: err.message });
  }
  return false;
}

function renderNotifs(){

    $('notifList').innerHTML = emptyState(t('notif.emptyTitle'), t('notif.emptySub')); return;
  }
  $('notifList').innerHTML = allMatches.map(m => {
    const owner = m.lostAuthorId === CURRENT_UID;
    const pct = Math.round((m.similarityScore||0)*100);
    let txt = '', cta = '';
    if (m.matchStatus === 'waiting_for_user' && owner){
      txt = t('notif.foundMatch', { pct, rank:m.matchRank });
      cta = `<button class="btn small accent" onclick="openMatchPage('${m.lostPostId}')">${esc(t('detail.checkNow'))}</button>`;
    } else if (m.matchStatus === 'awaiting_finder'){
      txt = t(owner ? 'consent.ownerDone' : 'consent.askFinder');
      cta = `<button class="btn small accent" onclick="showView('matches')">${esc(t('notif.goSee'))}</button>`;
    } else if (m.matchStatus === 'declined'){
      txt = t(owner ? 'consent.declinedOwner' : 'consent.declined');
    } else if (m.matchStatus === 'accepted'){
      txt = t(owner ? 'notif.accepted' : 'notif.acceptedOther');
      cta = `<button class="btn small accent" onclick="showView('matches')">${esc(t('notif.goSee'))}</button>`;
    } else if (m.matchStatus === 'rejected'){
      txt = t('notif.rejected', { rank:m.matchRank });
    } else {
      txt = t('notif.waiting');
    }
    return `<div class="notif ${m.matchStatus==='waiting_for_user'?'unread':''}">
      <div class="txt">${esc(txt)}</div><div>${cta}</div></div>`;
  }).join('');
}

function contactBlock(m, myPost){
  const iAmFinder = m.foundAuthorId === CURRENT_UID;

  if (m.matchStatus === 'declined'){
    return `<div class="pending-note">${esc(t(iAmFinder ? 'consent.declined' : 'consent.declinedOwner'))}</div>`;
  }
  if (m.matchStatus === 'awaiting_finder'){
    if (iAmFinder){
      return `<div class="pending-note">${esc(t('consent.askFinder'))}
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn small accent" onclick="finderDecision('${m.id}',true)">${esc(t('consent.allow'))}</button>
          <button class="btn small" onclick="finderDecision('${m.id}',false)">${esc(t('consent.decline'))}</button>
        </div></div>`;
    }
    return `<div class="pending-note">${esc(t('consent.ownerDone'))}</div>`;
  }
  if (!m.contactRevealed){
    return `<div class="pending-note">${esc(t('match.revealPending'))}</div>`;
  }
  const iAmLost = m.lostAuthorId === CURRENT_UID;
  const them = iAmLost ? m.foundContact : m.lostContact;
  const resolved = myPost && myPost.status === 'resolved';

  setTimeout(() => {
    const cardEl = document.getElementById('animatedContactCard');
    if (cardEl) cardEl.classList.add('show');
  }, 100);

  return `<div id="animatedContactCard" class="contactreveal">✓ ${esc(t('match.confirmed', { name: them?.name || '-', email: them?.email || '-' }))}
    ${(iAmLost && them?.pickupNote) ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(27,122,95,.2)"><b>${esc(t('match.pickupNoteLabel'))}:</b> ${esc(them.pickupNote)}</div>` : ''}
    <div style="margin-top:10px"><button class="btn small accent" onclick="openConfirmedMatch('${m.id}')">${esc(t('match.viewDetail'))}</button></div>
    ${resolved ? `<div style="margin-top:6px">✓ ${esc(t('match.closed'))}</div>`
      : (myPost ? `<div style="margin-top:8px"><button class="btn small accent" onclick="markResolved('${myPost.id}')">✓ ${esc(t('match.markReturned'))}</button></div>` : '')}
  </div>`;
}

      : allMatches.filter(m => m.foundPostId === p.id && ['awaiting_finder','accepted','declined'].includes(m.matchStatus));
    if (!rel.length) return '';
    const waiting = rel.filter(m => m.matchStatus === 'waiting_for_user').length;
    const accepted = rel.find(m => ['awaiting_finder','accepted','declined'].includes(m.matchStatus));

function snapCard(label, snap, cls){
  return `<div class="match-item-card">
    <div class="match-photo">${snap.thumbUrl ? `<img src="${snap.thumbUrl}" alt="${esc(optionLabel('category',snap.category))}" onerror="this.parentElement.textContent='${esc(t('common.noImage'))}'">` : esc(t('common.noImage'))}</div>
    <div class="match-body">
      <span class="stamp ${cls}">${esc(label)}</span>
      <h3>${esc(optionLabel('category',snap.category))} · ${esc(optionLabel('color',snap.color))}</h3>
      <div class="match-desc">${esc(snap.description)}</div>
      <div style="font-size:12px;color:var(--ink-soft)">📍 ${esc(optionLabel('location',snap.location))} · ${fmtDate(snap.eventDate)}</div>
    </div></div>`;
}

function renderMatchDetail(){
  const root = $('matchDetailContent');
  if (verifyIdx >= verifyQueue.length){
    root.innerHTML = `<div class="notif" style="display:block;text-align:center;padding:46px 20px">
      <div class="display" style="font-size:20px">${esc(t('match.allDone'))}</div>
      <p style="color:var(--ink-soft);font-size:13px">${esc(t('match.allDoneSub'))}</p>
      <button class="btn primary" onclick="showView('matches')">${esc(t('match.backToList'))}</button></div>`;
    return;
  }
  const m = verifyQueue[verifyIdx];
  root.innerHTML = `<div class="progress-line">${esc(t('match.progress',{ i:verifyIdx+1, n:verifyQueue.length, rank:m.matchRank }))}</div>
    <div class="match-comparison">
      ${snapCard(t('match.yourItem'), m.lostSnap || {}, 'lost')}
      ${snapCard(t('match.systemFound'), m.foundSnap || {}, 'found')}
    </div>
    <div class="match-score-box">
      <div class="score-big">${Math.round((m.similarityScore||0)*100)}%</div>
      <div class="score-label">${esc(t('match.scoreLabel'))}</div>
      <ul class="match-reasons">${(m.reasons||[]).map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    </div>
    <div class="match-actions">
      <button class="btn danger" onclick="matchDecision(false)">✕ ${esc(t('match.notMine'))}</button>
      <button class="btn primary" onclick="matchDecision(true)">✓ ${esc(t('match.isMine'))}</button>
    </div>
    <div class="note-box">${esc(t('match.howTo'))}</div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn small" onclick="openReport('${m.foundPostId}')">${esc(t('report.button'))}</button>
    </div>`;
}

async function matchDecision(isMatch){
  const m = verifyQueue[verifyIdx]; if (!m) return;
  const status = isMatch ? 'accepted' : 'rejected';
  await updateDoc(doc(db,'matches',m.id), { matchStatus: status });
  m.matchStatus = status;
  if (isMatch){
    await loadContactForMatch(m);
    for (const o of allMatches.filter(x => x.lostPostId === m.lostPostId && x.id !== m.id && x.matchStatus === 'waiting_for_user')){
      await updateDoc(doc(db,'matches',o.id), { matchStatus:'rejected' });
      o.matchStatus = 'rejected';
    }
    updateBadge(); showView('matches');
    setTimeout(() => openConfirmedMatch(m.id), 0);
    return;
  }
  verifyIdx++; updateBadge(); renderMatchDetail();
}

async function finderDecision(matchId, allow){
  const m = allMatches.find(x => x.id === matchId); if (!m) return;
  const status = allow ? 'accepted' : 'declined';
  await updateDoc(doc(db,'matches',matchId), { matchStatus: status });
  m.matchStatus = status;
  rerender();
}

function openReport(postId){
  $('modalRoot').innerHTML = `<div class="modal-bg" onclick="this.remove()">
    <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true">
      <h3 style="margin:0 0 6px;font-size:17px">${esc(t('report.title'))}</h3>
      <div class="field" style="margin-top:14px">
        <label for="rpReason">${esc(t('report.reason'))}</label>
        <textarea id="rpReason" rows="3" placeholder="${esc(t('report.reasonPh'))}"></textarea>
      </div>
      <div class="msgline" id="rpMsg" role="status" aria-live="polite"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn primary" onclick="sendReport('${postId}')">${esc(t('report.send'))}</button>
        <button class="btn" onclick="this.closest('.modal-bg').remove()">${esc(t('common.cancel'))}</button>
      </div>
    </div></div>`;
}

async function sendReport(postId){
  const reason = $('rpReason').value.trim();
  const msg = $('rpMsg');
  if (!reason){ msg.style.color='var(--lost)'; msg.textContent = t('report.needReason'); return; }
  try{
    await addDoc(collection(db,'reports'), {
      postId, reporterId: CURRENT_UID, reporterEmail: auth.currentUser.email,
      reason, status: 'open', createdAt: serverTimestamp()
    });
    msg.style.color='var(--found)'; msg.textContent = t('report.sent');
    setTimeout(() => document.querySelector('.modal-bg')?.remove(), 1500);
  }catch(err){ msg.style.color='var(--lost)'; msg.textContent = err.message; }
}

async function sendResetFromProfile(){
  const msg = $('prPwMsg');
  try{
    await sendPasswordResetEmail(auth, auth.currentUser.email, { url: ACTION_URL, handleCodeInApp:false });
    msg.style.color='var(--found)'; msg.textContent = t('profile.resetSent');
  }catch(err){ msg.style.color='var(--lost)'; msg.textContent = thaiError(err.code); }
}

async function deleteAccount(){
  if (!confirm(t('profile.deleteConfirm'))) return;
  const msg = $('prDelMsg');
  try{
    for (const p of allPosts) {
      await deleteDoc(doc(db,'posts',p.id));
    }
    await deleteDoc(doc(db,'users',CURRENT_UID));
    await deleteUser(auth.currentUser);
    location.reload();
  }catch(err){
    msg.style.color='var(--lost)';
    msg.textContent = err.code === 'auth/requires-recent-login' ? t('profile.deleteRelogin') : thaiError(err.code);
  }
}

let adminPosts = [], adminCat = 'all', statsCache = null;

function accuracyFrom(list){
  const judged = list.filter(m => m.matchStatus === 'accepted' || m.matchStatus === 'rejected');
  const accepted = judged.filter(m => m.matchStatus === 'accepted');
  return { judged: judged.length, accepted: accepted.length,
           pct: judged.length ? Math.round(accepted.length / judged.length * 100) : null };
}
function goalCard(val, target, unit, label, note){
  const pctRaw = target ? (val / target * 100) : 0;
  const pct = Math.min(100, Math.round(pctRaw));
  return `<div class="goal">
    <div class="big">${val}${esc(unit)} <small>/ ${target}${esc(unit)}</small></div>
    <div class="lbl">${esc(label)}</div>
    <div class="track"><i class="${pct>=100?'done':''}" style="width:${pct}%"></i></div>
    <div class="note">${pct}%${note?' · '+esc(note):''}</div></div>`;
}

async function renderAdmin(){
  if (!IS_ADMIN){
    $('smartGoals').innerHTML = '';
    $('adminStats').innerHTML = '';
    $('adminReports').innerHTML = '';
    $('adminGrid').innerHTML = emptyState(t('admin.loadError'), '');
    return;
  }

  let posts = [], matches = [], users = 0, reports = [];
  try{
    $('adminGrid').innerHTML = `<p class="sub">${esc(t('common.loading'))}</p>`;
    const [ps, ms, us, rs] = await Promise.all([
      getDocs(collection(db,'posts')),
      getDocs(collection(db,'matches')),
      getDocs(collection(db,'users')),
      getDocs(query(collection(db,'reports'), where('status','==','open')))
    ]);
    posts = ps.docs.map(d => ({ id:d.id, ...d.data() }));
    matches = ms.docs.map(d => ({ id:d.id, ...d.data() }));
    users = us.size;
    reports = rs.docs.map(d => ({ id:d.id, ...d.data() }));
  }catch(e){
    console.error('โหลดข้อมูล Dashboard ทั้งระบบไม่สำเร็จ:', e);
    $('smartGoals').innerHTML = '';
    $('adminStats').innerHTML = '';
    $('adminReports').innerHTML = '';
    $('adminGrid').innerHTML = emptyState(t('admin.loadError'), '');
    return;
  }
  renderReports(reports, posts);

  adminPosts = posts;
  const lost = posts.filter(p=>p.type==='lost').length;
  const found = posts.filter(p=>p.type==='found').length;
  const resolved = posts.filter(p=>p.status==='resolved').length;
  const acc = accuracyFrom(matches);

  statsCache = { users, total:posts.length, lost, found, resolved,
                 matchesTotal:matches.length, judged:acc.judged, accepted:acc.accepted, accuracy:acc.pct };

  $('smartGoals').innerHTML =
    goalCard(users, SMART_TARGETS.users, '', t('admin.users'), '') +
    goalCard(posts.length, SMART_TARGETS.posts, '', t('admin.posts'), '') +
    goalCard(acc.pct ?? 0, SMART_TARGETS.accuracy, '%', t('admin.accuracy'),
      acc.judged ? t('admin.accuracyFrom',{n:acc.judged}) : t('admin.accuracyNone'));

  const cards = [
    ['all', t('admin.allPosts'), posts.length],
    ['lost', t('common.lost'), lost],
    ['found', t('common.found'), found],
    ['resolved', t('admin.returned'), resolved],
    ['accepted', t('admin.matched'), acc.accepted]
  ];
  $('adminStats').innerHTML = cards.map(([k,l,v]) =>
    `<button class="admin-stat" onclick="openAdminCat('${k}')"><div class="num">${v}</div><div class="label">${esc(l)}</div></button>`).join('');

  $('adminGrid').innerHTML = posts.slice(0,24).map(p => adminCardHTML(p)).join('') || emptyState(t('admin.noData'),'');
}

function renderReports(reports, posts){
  const box = $('adminReports');
  if (!reports.length){ box.innerHTML = `<p class="sub">${esc(t('admin.noReports'))}</p>`; return; }
  box.innerHTML = reports.map(r => {
    const p = posts.find(x => x.id === r.postId);
    return `<div class="notif" style="flex-direction:column;align-items:stretch;border-left:3px solid var(--lost)">
      <div class="txt"><b>${esc(r.reason)}</b></div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px">
        ${p ? esc(optionLabel('category',p.category)) + ' · ' + esc((p.description||'').slice(0,80)) : esc(t('detail.notFound'))}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        ${p ? `<button class="btn small" onclick="openAdminPost('${p.id}')">${esc(t('detail.title'))}</button>
               <button class="btn small" onclick="adminHidePost('${p.id}')">${esc(t('admin.hidePost'))}</button>
               <button class="btn small danger" onclick="adminDeletePost('${p.id}')">${esc(t('admin.deletePost'))}</button>` : ''}
        <button class="btn small accent" onclick="markReportHandled('${r.id}')">${esc(t('admin.markHandled'))}</button>
      </div></div>`;
  }).join('');
}

async function adminHidePost(id){
  if (!confirm(t('admin.confirmHide'))) return;
  await updateDoc(doc(db,'posts',id), { status:'resolved', hiddenReason:'admin', hiddenAt: serverTimestamp() });
  renderAdmin();
}
async function adminDeletePost(id){
  if (!confirm(t('admin.confirmDelete'))) return;
  await deleteDoc(doc(db,'posts',id));
  try{ await deleteDoc(doc(db,'postImages',id)); }catch(_){}
  renderAdmin();
}
async function markReportHandled(id){
  await updateDoc(doc(db,'reports',id), { status:'handled', handledAt: serverTimestamp() });
  renderAdmin();
}

function adminCardHTML(p){
  return `<button class="tagcard" onclick="openAdminPost('${p.id}')">
    <div class="photo">${p.thumbUrl?`<img src="${p.thumbUrl}" loading="lazy" alt="" onerror="this.parentElement.textContent='-'">`:esc(t('common.noImage'))}</div>
    <div class="body">
      <div class="toprow"><span class="cat">${esc(optionLabel('category',p.category))}</span>
      <span class="stamp ${p.type}">${esc(typeLabel(p.type))}</span></div>
      <div class="desc">${esc(p.description)}</div>
      <div class="meta"><span>${esc(optionLabel('color',p.color))}</span><span>${esc(p.authorName||'-')}</span></div>
    </div></button>`;
}

function openAdminCat(k){ adminCat = k; showView('admin-detail'); }

function renderAdminDetail(){
  const labels = { all:t('admin.allPosts'), lost:t('common.lost'), found:t('common.found'),
                   resolved:t('admin.returned'), accepted:t('admin.matched') };
  let list = adminPosts;
  if (adminCat === 'lost') list = adminPosts.filter(p=>p.type==='lost');
  else if (adminCat === 'found') list = adminPosts.filter(p=>p.type==='found');
  else if (adminCat === 'resolved' || adminCat === 'accepted') list = adminPosts.filter(p=>p.status==='resolved');

  $('adminDetailTitle').textContent = labels[adminCat] || '';
  $('adminDetailSub').textContent = t('admin.itemCount', { n:list.length });
  $('adminDetailList').innerHTML = list.map(p => `
    <button class="admin-post-row" onclick="openAdminPost('${p.id}')">
      <div class="thumb">${p.thumbUrl?`<img src="${p.thumbUrl}" loading="lazy" alt="">`:esc(t('common.noImage'))}</div>
      <div class="info">
        <span class="stamp ${p.type}">${esc(typeLabel(p.type))}</span>
        <h3>${esc(optionLabel('category',p.category))} · ${esc(optionLabel('color',p.color))}</h3>
        <p>${esc(p.description)}</p>
        <p>📍 ${esc(optionLabel('location',p.location))}</p>
        <p>${esc(t('admin.poster'))}: ${esc(p.authorName||'-')}</p>
        <p><b>${esc(p.status==='resolved'?t('common.resolved'):t('admin.inProgress'))}</b></p>
      </div></button>`).join('') || emptyState(t('admin.noData'),'');
}

function openAdminPost(id){
  const p = adminPosts.find(x => x.id === id) || postById(id);
  if (!p) return;
  $('modalRoot').innerHTML = `<div class="modal-bg" onclick="this.remove()">
    <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true">
      <button class="btn small" onclick="this.closest('.modal-bg').remove()">${esc(t('common.close'))}</button>
      ${p.thumbUrl?`<img src="${p.thumbUrl}" alt="" style="width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin:14px 0">`:''}
      <span class="stamp ${p.type}">${esc(typeLabel(p.type))}</span>
      <h2 style="margin:10px 0 6px;font-size:19px">${esc(optionLabel('category',p.category))} · ${esc(optionLabel('color',p.color))}</h2>
      <p style="font-size:13.5px">${esc(p.description)}</p>
      <p style="font-size:13px"><b>${esc(t('detail.location'))}:</b> ${esc(optionLabel('location',p.location))}</p>
      <p style="font-size:13px"><b>${esc(t('detail.date'))}:</b> ${fmtDate(p.eventDate)}</p>
      <p style="font-size:13px"><b>${esc(t('admin.poster'))}:</b> ${esc(p.authorName||'-')} (${esc(p.authorEmail||'-')})</p>
      ${p.hiddenReason ? `<p style="font-size:12px;color:var(--lost)">${esc(t('admin.hidden'))}</p>` : ''}
      ${profile?.role === 'admin' ? `<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn small" onclick="adminHidePost('${p.id}')">${esc(t('admin.hidePost'))}</button>
        <button class="btn small danger" onclick="adminDeletePost('${p.id}')">${esc(t('admin.deletePost'))}</button>
      </div>` : ''}
    </div></div>`;
}

function exportStats(){
  if (!statsCache) return;
  const d = statsCache;
  const rows = [
    ['Metric','Value','SMART Target'],
    ['Registered users', d.users, SMART_TARGETS.users],
    ['Total posts', d.total, SMART_TARGETS.posts],
    ['Lost posts', d.lost, '-'],
    ['Found posts', d.found, '-'],
    ['Resolved cases', d.resolved, '-'],
    ['Matches proposed', d.matchesTotal, '-'],
    ['Matches judged by users', d.judged, '-'],
    ['Matches confirmed correct', d.accepted, '-'],
    ['Matching accuracy (%)', d.accuracy ?? 'n/a', SMART_TARGETS.accuracy],
    ['Exported at', new Date().toISOString(), '-']
  ];
  const csv = '\uFEFF' + rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = `cmu-lost-found-stats-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
