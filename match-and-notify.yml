name: จับคู่ประกาศและส่งอีเมลแจ้งเตือน

on:
  schedule:
    # ทำงานทุก 5 นาที (GitHub อาจหน่วงได้ 5-15 นาทีในช่วงที่คนใช้เยอะ)
    - cron: "*/5 * * * *"
  # ปุ่มสั่งรันเองจากหน้า Actions ใช้ตอนทดสอบ
  workflow_dispatch:

# กันไม่ให้รันซ้อนกันจนสร้างคู่ซ้ำ
concurrency:
  group: match-and-notify
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ดึงโค้ดจาก repo
        uses: actions/checkout@v4

      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ติดตั้ง dependencies
        run: npm install --omit=dev

      - name: รันตัวจับคู่และส่งอีเมล
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_NAME: "CMU LOST&FOUND"
          SITE_URL: "https://jinjutasum88-beep.github.io/cmu-lost-found-final/"
        run: node scripts/match-and-notify.mjs
