name: ทดสอบระบบ (Unit Tests)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ดึงโค้ดจาก repo
        uses: actions/checkout@v4

      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: รันชุดทดสอบพร้อมวัด Coverage
        run: npm run test:coverage

      - name: ตรวจไวยากรณ์ของสคริปต์ฝั่งเซิร์ฟเวอร์
        run: node --check scripts/match-and-notify.mjs
